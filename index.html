r play a Time for Two game, participate in an evaluation, or communicate with us, and how we use and protect that information.</p><p>1. Information You Provide to Us</p><p>Depending upon how you use our website and games, we may collect information you provide directly to us, including:</p><p>your name;</p><p>email address;</p><p>purchase information;</p><p>customer-support communications;</p><p>responses you voluntarily provide on surveys or game-evaluation forms; and</p><p>other information you choose to send to us.</p><p>We do not ask players to provide information about their private game responses unless a particular survey or feature clearly tells them otherwise.</p><p>2. Payment Information</p><p>Purchases may be processed through a third-party payment processor</p><p>Time for Two does not directly receive or store your complete credit-card or debit-card number. Payment processors may provide us with transaction information such as your name, email address, transaction amount, payment status, and a transaction identifier.</p><p>Payment processors handle payment information under their own privacy policies and security practices.</p><p>3. Information Collected Automatically</p><p>When you use our website or browser games, certain information may be collected automatically.</p><p>Depending upon the technology we use, this may include:</p><p>Internet Protocol (IP) address;</p><p>browser type;</p><p>operating system;</p><p>device type;</p><p>approximate geographic area derived from an IP address;</p><p>pages or screens viewed;</p><p>date and time of visits;</p><p>game-session information;</p><p>referring website;</p><p>technical error information; and</p><p>cookies or similar technologies.</p><p>We may use this information to operate the service, understand how our games are being used, improve game design, diagnose technical problems, prevent fraud, and maintain security.</p><p>4. Game Play Information</p><p>Our preferred privacy approach is to collect as little information as reasonably necessary about what occurs between players during a game.</p><p>Unless a game feature specifically states otherwise, Time for Two does not intend to create personal profiles based on players\u2019 private answers to romantic or relationship questions.</p><p>If game responses need to be temporarily transmitted or stored for technical operation\u2014for example, to synchronize responses between two devices\u2014the Privacy Policy should be updated to explain:</p><p>what is transmitted or stored;</p><p>whether Time for Two can access it;</p><p>whether it is connected to an identifiable player;</p><p>how long it is retained; and</p><p>when it is deleted.</p><p>5. Evaluations and Surveys</p><p>We may invite players to complete voluntary surveys or evaluations.</p><p>A survey may request demographic information such as:</p><p>age range;</p><p>gender;</p><p>length of relationship;</p><p>general impressions of the game; and</p><p>an email address if a participant volunteers to participate in follow-up research.</p><p>Participation is voluntary.</p><p>Information from evaluations may be used to improve our games, understand player experiences, develop future products, and conduct internal research.</p><p>Where practicable, results may be analyzed in aggregated or de-identified form.</p><p>6. How We Use Information</p><p>We may use personal information to:</p><p>process purchases;</p><p>provide access to games;</p><p>operate and maintain our website;</p><p>respond to customer questions;</p><p>resolve technical problems;</p><p>prevent fraud or misuse;</p><p>improve games and services;</p><p>analyze general usage trends;</p><p>conduct voluntary game evaluations;</p><p>communicate about a purchase or requested service;</p><p>comply with legal obligations; and</p><p>protect the rights and security of Time for Two, our customers, and others.</p><p>We will not use personal information in a materially different way from that described in this Privacy Policy without providing appropriate notice or obtaining consent when required.</p><p>7. Marketing Communications</p><p>SELECT THE VERSION THAT MATCHES YOUR PLAN.]</p><p>If you choose to receive news, product announcements, special offers, or other marketing communications from Time for Two, we may use your email address for that purpose.</p><p>You may unsubscribe from marketing emails at any time by using the unsubscribe link contained in the message.</p><p>Service-related emails\u2014for example, purchase confirmations or important account information\u2014may still be sent when necessary.</p><p>We will not automatically add evaluation participants to a marketing list merely because they provided an email address for research follow-up unless they separately agree to receive marketing communications.</p><p>8. Cookies and Analytics</p><p>Our website may use cookies and similar technologies to keep the service functioning, remember appropriate settings, maintain security, and understand general website usage.</p><p>Where required by law, visitors will be provided appropriate choices regarding non-essential cookies or tracking technologies.</p><p>9. Sharing Information</p><p>We may provide information to companies that perform services on our behalf, such as:</p><p>payment processors;</p><p>website hosting providers;</p><p>cloud-service providers;</p><p>email providers;</p><p>analytics providers;</p><p>security providers; and</p><p>customer-support providers.</p><p>These companies receive information as necessary to perform services for us.</p><p>We may also disclose information if reasonably necessary to:</p><p>comply with law, regulation, subpoena, court order, or legal process;</p><p>investigate fraud or security problems;</p><p>protect the rights, property, or safety of Time for Two or others; or</p><p>complete a merger, acquisition, financing, sale, or other business transaction, subject to applicable legal requirements.</p><p>10. Sale or Sharing of Personal Information</p><p>Time for Two does not sell personal information for money.</p><p>11. How Long We Keep Information</p><p>We retain personal information only for as long as reasonably necessary for the purposes for which it was collected, including providing services, maintaining appropriate business and tax records, resolving disputes, protecting against fraud, and satisfying legal requirements.</p><p>Different categories of information may have different retention periods.</p><p>We will endeavor not to retain private gameplay information longer than technically necessary to operate the applicable game unless the player has specifically agreed to another use.</p><p>12. Information Security</p><p>We use reasonable administrative, technical, and organizational safeguards designed to protect personal information.</p><p>However, no internet transmission or electronic-storage system can be guaranteed to be completely secure.</p><p>We also select service providers with security practices appropriate to the services they perform for us.</p><p>13. Your Privacy Choices and Rights</p><p>Depending upon where you live, you may have legal rights concerning your personal information.</p><p>These may include rights to:</p><p>request information about personal information we maintain about you;</p><p>request correction of inaccurate information;</p><p>request deletion of certain information;</p><p>obtain a copy of certain information;</p><p>opt out of certain uses or disclosures; and</p><p>exercise applicable privacy rights without unlawful discrimination.</p><p>These rights are subject to exceptions and eligibility requirements under applicable law.</p><p>14. California Residents</p><p>If Time for Two becomes subject to the California Consumer Privacy Act or another applicable California privacy requirement, California residents may have additional rights regarding access, correction, deletion, and certain sharing or selling of personal information.</p><p>Our practices and any required California notices will be updated as necessary based upon the nature and scale of our business and data practices.</p><p>15. Do Not Track and Browser Privacy Signals</p><p>Some browsers offer \u201cDo Not Track\u201d or other privacy preference signals.</p><p>Where applicable law requires recognition of a legally valid opt-out preference signal, we will process that signal as required.</p><p>16. Links to Other Websites</p><p>Our website may contain links to websites or services operated by other organizations.</p><p>Their privacy practices are governed by their own policies, and Time for Two is not responsible for the privacy practices of third-party websites.</p><p>17. Changes to This Privacy Policy</p><p>We may update this Privacy Policy when our services, technology, or legal obligations change.</p><p>The \u201cLast Updated\u201d date at the beginning of the Policy will identify the most recent version.</p><p>If a change materially affects how we use personal information already collected, we will provide any notice or obtain any consent required by applicable law.</p><p>18. Contact Us</p><p>Questions or requests concerning privacy may be directed to:</p><p>Time for Two, Inc.\nAttn: Privacy\nEmail: michael@timefortwo.com</p><p>Suggested portal footer: \u00a9 2026 Time for Two, Inc. \u00b7 Terms of Use \u00b7 Privacy Policy \u00b7</p>";

const PEER_OPTS={config:{iceServers:[

  {urls:'turn:global.relay.metered.ca:80',username:'cd732b812a485102196272c2',credential:'NVt7SJfvxCZPwnYH'},
  {urls:'turn:global.relay.metered.ca:80?transport=tcp',username:'cd732b812a485102196272c2',credential:'NVt7SJfvxCZPwnYH'},
  {urls:'turn:global.relay.metered.ca:443',username:'cd732b812a485102196272c2',credential:'NVt7SJfvxCZPwnYH'},
  {urls:'turns:global.relay.metered.ca:443?transport=tcp',username:'cd732b812a485102196272c2',credential:'NVt7SJfvxCZPwnYH'}
]}};
function peerId(code){return (DEMO?'tkyb-demo-':'tkyb-game-')+code.toLowerCase()}
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const sc=document.createElement('script');sc.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';sc.onload=()=>res();sc.onerror=()=>rej(new Error('peerjs'));document.head.appendChild(sc)})}
function wrapPeerConn(c){let closed=false;const w={_d:null,_c:null,send(d){try{if(c.open)c.send(d)}catch(e){}},close(){try{c.close()}catch(e){}fire()}};

  c.on('data',d=>w._d&&w._d(d));c.on('close',fire);c.on('error',fire);return w}
/* Same-browser test transport (BroadcastChannel) — used only with ?net=local */
function mkLocal(ch,cid,side){let closed=false;const w={_d:null,_c:null,send(d){if(!closed)try{ch.postMessage({to:side,cid,k:'data',d})}catch(e){}},close(){if(closed)return;try{ch.postMessage({to:side,cid,k:'close'})}catch(e){}w._fire()},_fire(){if(closed)return;closed=true;w._c&&w._c()}};return w}
const Local={
  host(code,onConn){const ch=new BroadcastChannel('tkyb-local-'+code),conns={};
    ch.onmessage=e=>{const m=e.data;if(!m||m.to!=='h')return;
      if(m.k==='open'){const w=mkLocal(ch,m.cid,'g');conns[m.cid]=w;ch.postMessage({to:'g',cid:m.cid,k:'ack'});onConn(w)}
      else if(conns[m.cid]){if(m.k==='data'){conns[m.cid]._d&&conns[m.cid]._d(m.d)}else if(m.k==='close'){conns[m.cid]._fire();delete conns[m.cid]}}};
    return {destroy(){Object.values(conns).forEach(w=>w.close());ch.close()}}},
  connect(code,onOpen,onFail){const ch=new BroadcastChannel('tkyb-local-'+code),cid=rand(),w=mkLocal(ch,cid,'h');let ok=false;
    ch.onmessage=e=>{const m=e.data;if(!m||m.to!=='g'||m.cid!==cid)return;
      if(m.k==='ack'){ok=true;onOpen(w)}else if(m.k==='data'){w._d&&w._d(m.d)}else if(m.k==='close'){w._fire()}};

async function startHost(resume){

  try{await loadPeer()}catch(e){N.connecting=false;N.error='Couldn’t load the connection service. Check your internet connection, then reload this page.';draw();return}

function openHostPeer(retries){
  if(peer){try{peer.destroy()}catch(e){}}
  const p=new Peer(peerId(N.code),PEER_OPTS);peer=p;
  p.on('open',()=>{if(peer!==p)return;N.connecting=false;N.online=true;N.error='';broadcast()});
  p.on('connection',c=>{const w=wrapPeerConn(c);let done=false;const go2=()=>{if(!done){done=true;onGuestConn(w)}};c.on('open',go2);if(c.open)go2()});

    if(t==='unavailable-id'){

      if(N.G.stage==='lobby'&&!N.G.seated[1]){N.code=makeCode();N.G.code=N.code;SS.set(TAB_KEY,{role:'host',code:N.code,screen});saveHost();openHostPeer(0);return}
      N.connecting=false;N.error='Game '+N.code+' couldn’t be reopened yet. Wait a few seconds, then reload this page.';draw();return}
    if(['network','server-error','socket-error','socket-closed'].includes(t)){N.online=false;updateStatus();setTimeout(()=>{try{if(peer===p&&!p.destroyed)p.reconnect()}catch(x){}},3000)}
  });
}
function onGuestConn(w){

    if(d.t==='ping')return;
    if(d.t==='join'){
      const G=N.G,name=String(d.name||'').trim().slice(0,30)||'Player 2';
      const sameName=G.names[1]&&name.toLowerCase()===G.names[1].toLowerCase();
      if(!G.seated[1]||(d.token&&d.token===G.guestToken)||sameName){
        if(guestConn&&guestConn!==w){const old=guestConn;guestConn=null;old.close()}
        if(!G.seated[1])TKYBLogic.seatGuest(G,name);else G.conn[1]=true;
        if(!G.guestToken||d.token!==G.guestToken)G.guestToken=rand();

/* ---------- partner's device (player 2) ---------- */
let guestPeer=null,reconnectTimer=null,joinedOnce=false,attempt=0;
async function startJoin(code,name,token,resuming){
  N.role='guest';N.me=1;N.code=code;N.name=name;N.error='';N.ended='';N.resuming=!!resuming;joinedOnce=false;
  SS.set(TAB_KEY,{role:'guest',code,screen});

  N.connecting=true;draw();keepAwake();
  if(NET_MODE!=='local'){try{await loadPeer()}catch(e){N.connecting=false;N.error='Couldn’t load the connection service. Check your internet connection and try again.';dropGuest(false);draw();return}}

function dropGuest(keepSaved){N.role=null;N.snap=null;SS.del(TAB_KEY);if(!keepSaved)LS.del(GUEST_KEY);clearTimeout(reconnectTimer);try{guestPeer&&guestPeer.destroy()}catch(e){}guestPeer=null}
function scheduleReconnect(ms){if(N.role!=='guest')return;clearTimeout(reconnectTimer);N.online=false;updateStatus();reconnectTimer=setTimeout(connectGuest,ms||2500)}
function connectGuest(){
  if(N.role!=='guest')return;clearTimeout(reconnectTimer);
  const my=++attempt;
  const onOpen=w=>{
    if(my!==attempt||N.role!=='guest'){w.close();return}
    if(N.conn&&N.conn!==w){const old=N.conn;N.conn=null;old.close()}
    N.conn=w;N.lastHeard=Date.now();
    w._d=d=>{if(N.conn!==w||!d)return;N.lastHeard=Date.now();
      if(d.t==='welcome'){N.online=true;N.connecting=false;N.error='';joinedOnce=true;N.resuming=false;const sv=LS.get(GUEST_KEY)||{};sv.token=d.token;sv.at=Date.now();sv.code=N.code;sv.name=N.name;LS.set(GUEST_KEY,sv);if(screen==='invite'||screen==='home'||screen==='description')go('directions');else draw()}
      else if(d.t==='reject'){N.connecting=false;N.error=d.reason;dropGuest(false);screen='invite';inviteMode='join';draw()}
      else if(d.t==='bye'){dropGuest(false);N.ended=nm(0)+' ended the game.';screen='home';stack=[];draw()}
      else if(d.t==='state'){N.online=true;const sv=LS.get(GUEST_KEY);if(sv){sv.at=Date.now();LS.set(GUEST_KEY,sv)}onSnapshot(d.snap)}

    const sv=LS.get(GUEST_KEY)||{};w.send({t:'join',name:N.name,token:sv.token||null});

/* ---------- both devices ---------- */
function send(m){
  const sn=N.snap;m.round=sn?sn.round:1;
  if(N.role==='host'){apply(0,m);return true}
  if(N.role==='guest'&&N.conn&&N.online){N.conn.send(m);return true}
  if(m.t!=='lock'&&m.t!=='actDone')toast('Reconnecting… try again in a moment.');return false;
}
function onSnapshot(sn){
  const prev=N.snap;N.snap=sn;
  if(prev&&prev.stage==='result'&&sn.stage==='lobby'){screen='activity';stack=[];stackY=[]}
  if(sn.stage!=='game'||(prev&&prev.cardIndex!==sn.cardIndex))viewPrev=false;
    syncPrivate(sn);draw();
}
/* Re-sends this device's hidden choices when the game asks for them (also after a refresh). */
function syncPrivate(sn){
  const p=myPriv(),me=N.me;
  if(sn.stage==='lobby'){
    if(sn.actDone[me]&&p.activity===null)later(()=>send({t:'actDone',done:false}));
    if(!sn.actDone[me]&&p.activity!==null&&p.actConfirmed)later(()=>send({t:'actDone',done:true}));
  }
  if(sn.stage==='game'){
    const c=DECKS[sn.deck][sn.cardIndex];
    if(c.type==='GUESS'){const mine=p.picks[sn.cardIndex];
      if(sn.phase==='pick'&&sn.locked[me]&&mine==null)later(()=>send({t:'unlock',card:sn.cardIndex}));
      /* A Lock tapped while the connection was dropping is re-sent once reconnected. */
      if(sn.phase==='pick'&&!sn.locked[me]&&mine!=null&&p.lockIntent===sn.cardIndex)later(()=>send({t:'lock',card:sn.cardIndex}));
      if(sn.phase==='collect'){if(mine==null)later(()=>send({t:'unlock',card:sn.cardIndex}));else later(()=>send({t:'pick',card:sn.cardIndex,choice:mine}))}
    }
  }
  if(sn.stage==='final'&&!sn.actSent[me]&&p.activity!==null)later(()=>send({t:'activity',choice:p.activity}));
}
setInterval(()=>{
  const now=Date.now();
  if(N.role==='guest'&&N.conn){N.conn.send({t:'ping'});if(now-N.lastHeard>HB.dead){const c=N.conn;N.conn=null;c.close();N.online=false;draw();scheduleReconnect(500)}}
  if(N.role==='host'&&guestConn){guestConn.send({t:'ping'});if(now-lastHeardGuest>HB.dead){const c=guestConn;guestConn=null;c.close();if(N.G){N.G.conn[1]=false;broadcast()}}}
},HB.every);
document.addEventListener('visibilitychange',()=>{

  if(N.role==='host'&&peer&&peer.disconnected&&!peer.destroyed){try{peer.reconnect()}catch(e){}}
});

function finishActivity(){const p=myPriv();if(p.activity===null)p.activity=5;p.actConfirmed=true;setPriv(p);send({t:'actDone',done:true});if(N.snap&&N.snap.stage==='final')return draw();go('setup')}
function startGame(){send({t:'start'})}
function choose(i){const sn=N.snap;if(!sn||sn.phase!=='pick'||sn.locked[N.me])return;if(myPriv().lockIntent===sn.cardIndex)return;const p=myPriv();p.sel[sn.cardIndex]=i;setPriv(p);draw()}
function lockMine(){const sn=N.snap,p=myPriv(),sel=p.sel[sn.cardIndex];if(sel==null)return;p.picks[sn.cardIndex]=sel;p.lockIntent=sn.cardIndex;setPriv(p);send({t:'lock',card:sn.cardIndex});draw()}
function changeMine(){const p=myPriv();p.lockIntent=null;setPriv(p);send({t:'unlock',card:N.snap.cardIndex});draw()}
function nextCard(){send({t:'next',card:N.snap.cardIndex})}
/* ---- card turning ---- */
let animRunning=null,backKey=null,doneKey=null;
const TURN_MS=1400;     /* how long the turn takes (chosen from the Nov 3 timing demo) */
function openCard(){const sn=N.snap;if(!sn||sn.turned)return;const b=document.querySelector('.cb-open');if(b){b.disabled=true;b.textContent='Opening…'}if(!send({t:'turn',card:sn.cardIndex})&&b){b.disabled=false;b.textContent='Open card'}}
function startTurnAnim(key){
  const el=document.querySelector('.flip-inner');if(!el){animRunning=null;return}
  animRunning=key;void el.offsetWidth;el.classList.add('is-turned');
  setTimeout(()=>{if(animRunning===key){animRunning=null;doneKey=key;draw()}},TURN_MS+40);
}
const BUBBLE_SVG=`<svg viewBox="0 0 260 180" role="img" aria-label="Let's Chat!"><path d="M130 14c62 0 112 27 112 66s-50 66-112 66c-13 0-25-1-37-4l-38 28 9-38C38 120 18 101 18 80c0-39 50-66 112-66z" fill="#fff"/><text x="130" y="93" text-anchor="middle" class="cb-bubble-text">Let’s Chat!</text></svg>`;
function cardBackHtml(type,a,ctl){
  const art=type==='TALK'?`<div class="cb-art">${BUBBLE_SVG}</div>`:`<div class="cb-q" aria-hidden="true">?</div><div class="cb-title">Can You<br>Guess?</div>`;
  return `<div class="cb ${type==='TALK'?'talk-back':'guess-back'}" aria-label="${type==='TALK'?'Talk':'Guess'} card"><div class="cb-frame"></div>${art}<div class="cb-brand">To Know You…Better</div>${ctl||''}</div>`;
}
function playAgain(){send({t:'again'})}
function leaveGame(){
  if(N.role==='host'){if(guestConn)guestConn.send({t:'bye'});LS.del(HOST_KEY);setTimeout(()=>{try{peer&&peer.destroy()}catch(e){}peer=null;if(localHost)localHost.destroy();localHost=null},300);N.G=null;N.snap=null;N.role=null;SS.del(TAB_KEY)}
  else if(N.role==='guest'){try{N.conn&&N.conn.close()}catch(e){}N.conn=null;dropGuest(false)}
  N.online=false;N.code='';screen='home';stack=[];draw();
}
function resumeSaved(which){
  const hs=fresh(LS.get(HOST_KEY)),gs=fresh(LS.get(GUEST_KEY));
  if(which==='host'&&hs){screen=hs.G.stage==='lobby'?'invite':'game';inviteMode='host';startHost(hs)}
  else if(which==='guest'&&gs){screen=N.snap?screen:'directions';startJoin(gs.code,gs.name,gs.token,true)}
}
function discardSaved(which){if(which==='host')LS.del(HOST_KEY);else LS.del(GUEST_KEY);draw()}

/* ================= SCREENS ================= */
function draw(){
  const sn=N.snap;
  if(sn&&N.role){if(sn.stage==='game'){screen='game'}else if(sn.stage==='final'){screen='final'}else if(sn.stage==='result'){screen='result'}else if(['game','final','result'].includes(screen)){screen='setup'}}
  if(['game','final','result','setup','activity'].includes(screen)&&N.role&&!sn){
    /* Rejoining after a refresh: wait for the game instead of drawing a card with no data. */
    return render(`<div class="content intro-panel"><div class="code-card"><div class="code-label">Game ${esc(N.code)}</div><div class="partner-line">${N.error?esc(N.error):'Reconnecting to your game…'}</div></div><div class="actions">${btn('Leave this game','leaveGame()','quiet-back')}</div></div>`);
  }
  if(screen==='home')return drawHome();
  if(screen==='description')return render(`<div class="description-screen"><div class="description-logo-wrap"><img class="description-logo-art" src="${TITLE_ART}" alt="To Know You…Better™ — Talking, Listening, Laughing… It’s all part of the game."></div><p>How well do you really know each other? You may be surprised!</p><p>To Know You…Better® is an award-winning conversation game filled with entertaining questions, delightful discoveries, and a lot of humor. Perfect for friends, family, and couples.</p><p>Play together in person or remotely.</p><div class="access-grid">${btn('Start a New Game<small>I’ll invite my partner</small>','goHost()','t2-access')}${btn('Join a Game<small>I have an invite code</small>','goJoin()','t2-access')}</div><div class="access-note"><b>How to begin:</b> one of you taps <b>Start a New Game</b> and gets a 4-character invite code. Your partner taps <b>Join a Game</b> and enters that code. In the production version, Start a New Game will include purchase; this test version is free.</div><div class="links-line"><button onclick="goInfo('terms')">Terms of Use</button><button onclick="goInfo('privacy')">Privacy Policy</button></div><div class="actions">${btn('← Back','goBack()','quiet-back')}</div></div>`);
  if(screen==='invite')return drawInvite();
  if(screen==='directions')return render(`<div class="content steps"><h1>Directions</h1><div class="directions-copy"><h2>How to Play</h2><p>To Know You…Better® is about sharing interests, experiences, preferences, and dreams. The more you talk about your answers and the more candid you are, the more fun you'll have!</p><h2>Activities</h2><p>You and your partner each privately choose an activity from the suggested Activity List that you'd enjoy together in the next few weeks. The winner's choice is revealed at the end, and their partner makes the arrangements.</p><h2>Guess Cards</h2><p>Read the quotation and question aloud. On your own screen, privately choose the answer that comes closest to expressing your preference or personality. Your partner sees the same choices on their screen and guesses your answer. The answer choices may not include the specific things you actually think, feel, or would do, but may simply suggest something about your personality. If your partner guesses correctly, they earn one point for that card.</p><h2>Talk Cards</h2><p>Read both the quotation and question aloud, then answer the question. No points are awarded for Talk cards.</p><h2>The Play</h2><p>Take turns answering questions and choose <strong>Next</strong> when ready. The running score appears at the top of the cards. When you've finished all the cards, whoever has the most points wins their selected future activity, arranged by their partner. If tied, choose one activity together—or do both. You'll both enjoy them.</p></div><div class="actions">${btn('Continue to Activities →',N.role?"go('activity')":'goHost()')}${btn('← Back','goBack()','quiet-back')}</div><div class="links-line"><button onclick="goInfo('qa')">Q&amp;A</button><button onclick="goInfo('terms')">Terms of Use</button><button onclick="goInfo('privacy')">Privacy Policy</button></div></div>`);
  if(screen==='setup')return drawSetup();
  if(screen==='info')return render(`<div class="content steps"><div class="onboard-kicker">Information</div><h1>${info==='qa'?'Questions & Answers':info==='terms'?'Terms of Use':'Privacy Policy'}</h1><div class="legal-copy">${info==='qa'?`<section class="faq-section" aria-label="Questions and Answers"><h2>Questions &amp; Answers</h2><p class="faq-intro">Quick answers while you play. Tap a question to see the answer.</p><details class="faq-item"><summary>Who can play, and do we have to be together?</summary><p>Two people—friends, family members, dating partners, or couples—can play in person or remotely, each on their own device.</p></details><details class="faq-item"><summary>How long does a game take?</summary><p>You should plan on the game taking about an hour. Of course, the more you and your partner have to say, the longer (and better) the game.</p></details><details class="faq-item"><summary>What is the difference between GUESS and TALK cards?</summary><p>On a GUESS card, one of you privately chooses an answer and the other tries to guess what their partner has chosen. A correct guess earns one point. TALK cards encourage conversation and do not earn points.</p></details><details class="faq-item"><summary>Do we take turns?</summary><p>Yes. You and your partner alternate roles on GUESS cards. On TALK cards, the partner named at the top of the card starts the conversation.</p></details><details class="faq-item"><summary>How do you win?</summary><p>At the end of the game, whoever has the most points wins the activity they selected at the start of the game. Their partner makes the activity happen—ideally within two weeks. If tied, choose an activity together or enjoy both.</p></details><details class="faq-item"><summary>Can we play again?</summary><p>Of course! Your answers and conversations may be different the next time you play. When you choose <b>Play again</b>, you switch places—whoever went second last time goes first.</p></details></section>`:info==='terms'?LEGAL_TERMS:LEGAL_PRIVACY}</div><div class="actions">${stack[stack.length-1]==='description'?btn('Back to Description','goBack()','alt'):btn('← Back','goBack()','alt')}</div></div>`);
  if(screen==='activity')return drawActivity(false);
  if(screen==='game')return drawGame();
  if(screen==='final')return drawFinal();
  if(screen==='result')return drawResult();
}
function drawHome(){
  const hs=fresh(LS.get(HOST_KEY)),gs=fresh(LS.get(GUEST_KEY));
  let extra='';
  if(N.ended)extra=`<div class="t2-resume"><p>${esc(N.ended)}</p></div>`;
  else if(N.role)extra=`<div class="t2-resume"><p>You’re in game <b>${esc(N.code)}</b>.</p>${btn('Return to your game',"go('"+(N.snap&&N.snap.stage!=='lobby'?'game':'directions')+"')",'alt')}</div>`;
  else if(hs&&hs.G&&hs.G.stage!=='result')extra=`<div class="t2-resume"><p>You have a game in progress (code <b>${esc(hs.code)}</b>).</p>${btn('Resume game',"resumeSaved('host')",'alt')}<button class="link-btn" onclick="discardSaved('host')">Start over instead</button></div>`;
  else if(gs)extra=`<div class="t2-resume"><p>You have a game in progress (code <b>${esc(gs.code)}</b>).</p>${btn('Rejoin game',"resumeSaved('guest')",'alt')}<button class="link-btn" onclick="discardSaved('guest')">Start over instead</button></div>`;
  return render(`<div class="hero logo-home title-redesign"><div class="title-arc arc-1"></div><div class="title-arc arc-2"></div><div class="title-arc arc-3"></div><div class="title-arc arc-4"></div><div class="title-art"><img class="single-title-art" src="${TITLE_ART}" alt="To Know You…Better™ colorful hourglass and tagline"></div><div class="actions">${btn('Continue →','goDescription()')}</div>${extra}</div>`);
}
function drawInvite(){
  const head=`<h1>You're invited to get to know each other…better!</h1><p>Talking, listening, laughing—it's all part of the game. Discover unexpected answers, share stories, and compete for the chance to choose something fun to enjoy together after the game.</p>`;
  const err=N.error?`<p class="t2-error">${esc(N.error)}</p>`:'';
  const back=btn('← Back','goBack()','quiet-back');
  if(N.role==='host'){
    const sn=N.snap,seated=sn&&sn.seated[1];
    return render(`<div class="content intro-panel">${head}<div class="code-card"><div class="code-label">Your invite code — send this to your partner</div><div class="code-big" id="game-code">${N.connecting?'····':esc(N.code)}</div><p class="code-help">Send your partner this link, or have them choose <b>Join a Game</b> and enter the code.</p><input class="code-link" id="invite-link" readonly value="${esc(inviteLink())}" onclick="this.select()"><div class="code-actions"><button class="btn alt" onclick="copyLink()">Copy invite link</button>${navigator.share?'<button class="btn alt" onclick="shareLink()">Share…</button>':''}</div><div class="partner-line ${seated?'ok':''}">${N.connecting?'Opening your game…':seated?'✓ '+esc(nm(1))+' has joined!':'Waiting for your partner to join…'}</div></div>${err}<div class="actions">${btn('Continue to Directions →',"go('directions')")}${back}</div></div>`);
  }
  if(N.role==='guest'){
    return render(`<div class="content intro-panel">${head}<div class="code-card"><div class="code-label">Game code</div><div class="code-big">${esc(N.code)}</div><div class="partner-line ${N.online?'ok':''}">${N.online?'✓ You’ve joined '+esc(nm(0))+'’s game.':'Joining game '+esc(N.code)+'…'}</div></div>${err}<div class="actions">${btn('Continue to Directions →',"go('directions')")}${back}</div></div>`);
  }
  if(inviteMode==='join')
    return render(`<div class="content intro-panel">${head}<div class="t2-step"><b>Joining your partner’s game</b>Enter your name and the 4-character invite code your partner gave you.</div><div class="inputrow name-entry" style="text-align:left"><div class="field"><label for="p1">Your name</label><input id="p1" maxlength="30" value="${esc(N.name)}" placeholder="Name"></div><div class="field"><label for="code">Invite code</label><input id="code" maxlength="4" value="${esc(joinCode)}" placeholder="4-character code" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.25em"></div></div>${err}<div class="actions">${btn('Join Game →','joinGame()')}${back}</div><button class="link-btn t2-switch" onclick="inviteMode='host';N.error='';draw()">Don’t have a code? Start a new game instead →</button></div>`);
  return render(`<div class="content intro-panel">${head}<div class="t2-step"><b>Starting a new game</b>Enter your name. On the next screen you’ll get an invite code to send your partner.</div><div class="inputrow name-entry" style="text-align:left"><div class="field"><label for="p1">Your name</label><input id="p1" maxlength="30" value="${esc(N.name)}" placeholder="Name"></div></div>${err}<div class="actions">${btn('Create Game &amp; Invite Code →','createGame()')}${back}</div><button class="link-btn t2-switch" onclick="inviteMode='join';N.error='';draw()">Already have an invite code? Join your partner’s game instead →</button></div>`);
}
function drawActivity(atEnd){
  const p=myPriv(),myName=N.role?nm(N.me):'Player 1';
  const intro=atEnd?`<p>Your activity choice wasn’t saved on this device. Please choose it again — it stays hidden until the winner is revealed.</p>`:`<p>Choose an activity below, then press the button at the bottom. Your choice stays hidden until the end.</p>`;
  return render(`<div class="content"><div class="eyebrow">Activity selection · private</div><h1>${esc(myName)}, choose your prize!</h1>${intro}${ACT.map((a,i)=>`<button class="activity ${p.activity===i?'selected':''}" onclick="pickActivity(${i})"><strong>${esc(a[0])}</strong><small>${esc(a[1])}</small></button>`).join('')}<div class="actions">${btn(atEnd?'Reveal the winner →':'Continue →','finishActivity()','')}${atEnd?'':btn('← Back','goBack()','quiet-back')}</div></div>`);
}
function drawSetup(){
  const sn=N.snap,host=N.role==='host',deck=sn?sn.deck:18;
  const dis=host?'':'disabled';
  let action;
  if(!N.role)action=btn('Create Game &amp; Invite Code →','goHost()');
  else if(host){
    const why=!sn.seated[1]?'Waiting for your partner to join…':!sn.actDone[0]?'Choose your activity first':!sn.actDone[1]?'Waiting for '+esc(nm(1))+' to choose an activity…':'';
    action=why?`<button class="btn" disabled>${why}</button>`:btn('START PLAYING →','startGame()');
  }else action=`<div class="t2-wait">${sn&&sn.actDone[1]?'Waiting for '+esc(nm(0))+' to start the game…':'Choose your activity first'}</div>`;
  const who=host||!N.role?'':' <b>'+esc(nm(0))+'</b> will start the game.';
  return render(`<div class="content"><div class="onboard-kicker">Almost ready</div><h1 style="color:#492B69">Ready to Play</h1><p>When you and your partner have both chosen an activity, the game can begin.${who}</p><div class="actions">${action}${btn('← Back','goBack()','quiet-back')}</div></div>`);
}
function netBanner(){
  if(N.role==='guest'&&!N.online)return `<div class="net-banner">Reconnecting… your game is saved.</div>`;
  if(N.role==='host'&&!N.online)return `<div class="net-banner">Reconnecting… your game is saved.</div>`;
  if(N.role==='host'&&N.snap&&N.snap.seated[1]&&!N.snap.conn[1])return `<div class="net-banner">Waiting for ${esc(nm(1))} to reconnect…</div>`;
  return '';
}
function drawGame(){
  const sn=N.snap,deck=DECKS[sn.deck],me=N.me;
  const idx=viewPrev&&sn.cardIndex>0?sn.cardIndex-1:sn.cardIndex;
  const c=deck[idx],a=TKYBLogic.designated(deck,idx,sn.first),g=1-a,last=sn.cardIndex===deck.length-1;
  const header=`<div class="score-strip"><span><strong>${esc(nm(0))}</strong><span>${sn.scores[0]} ${sn.scores[0]===1?'point':'points'}</span></span><span><strong>${esc(nm(1))}</strong><span>${sn.scores[1]} ${sn.scores[1]===1?'point':'points'}</span></span></div>`;
  const quote=`<div class="quote-group"><div class="quote-inline"><div class="quote">${esc(c.quote)}</div>${c.author?`<div class="author">${esc(c.author)}</div>`:''}</div></div>`;
  const question=`<div class="question">${esc(c.question)}</div>`;
  const back=sn.cardIndex>0?`<button class="card-back" onclick="showPrev()" aria-label="Look at the previous card">← Back</button>`:'<span></span>';
  const nextOrWait=me===a?`<button class="next-arrow" aria-label="${last?'See winner':'Next card'}" onclick="nextCard()">➜</button>`:`<span class="wait-note">Waiting for ${esc(nm(a))} to tap Next</span>`;
  const revealHtml=ans=>`<div class="reveal-panels simultaneous"><div class="answer-reveal"><small>${esc(nm(a))} answered <b class="ans-letter">${'ABCD'[ans[a]]}</b></small><strong>${esc(c.options[ans[a]])}</strong></div><div class="answer-reveal"><small>${esc(nm(g))} guessed <b class="ans-letter">${'ABCD'[ans[g]]}</b></small><strong>${esc(c.options[ans[g]])}</strong></div><p>${ans[a]===ans[g]?'Correct guess!':'Not quite! No point this time.'}</p></div>`;
  const summary=ans=>`<span class="reveal-summary"><span>${esc(nm(a))} answered <b>${String.fromCharCode(65+ans[a])}</b></span><span>${esc(nm(g))} guessed <b>${String.fromCharCode(65+ans[g])}</b></span></span>`;
  /* Card turning: each new card arrives face down. The player whose turn it is taps Open card;
     the card then turns over on both devices. A card already open when the page loads is shown open. */
  let mode='plain',ctl='';
  if(CARD_TURN&&!viewPrev){
    const key=sn.round+':'+sn.cardIndex;
    if(!sn.turned){mode='back';backKey=key;
      ctl=me===a?`<button class="cb-open" onclick="openCard()">Open card</button>`:`<div class="cb-hint wait">Waiting for ${esc(nm(a))} to open the card</div>`;}
    else if(backKey===key&&doneKey!==key&&!REDUCE_MOTION){
      if(animRunning===key)return;                                       // let the turn finish
      mode='animate';
    }
  }
  const wrap=(cls,inner)=>{
    const front=`<div class="card ${cls}">${header}${inner}</div>`;
    if(mode==='plain')return render(`<div class="content game-wrap">${netBanner()}${front}</div>`);
    render(`<div class="content game-wrap">${netBanner()}<div class="flip"><div class="flip-inner"><div class="flip-face flip-back">${cardBackHtml(c.type,a,mode==='back'?ctl:'')}</div><div class="flip-face flip-front" inert aria-hidden="true">${front}</div></div></div></div>`);
    if(mode==='animate')startTurnAnim(sn.round+':'+sn.cardIndex);
  };
  if(viewPrev&&idx!==sn.cardIndex){
    const ret=`<div class="card-bottom"><span></span><button class="phase-button" onclick="hidePrev()">Return to current card →</button></div>`;
    const tag=`<div class="prev-banner">Previous card · view only</div>`;
    if(c.type==='TALK')return wrap('talk',`${tag}<div class="who">${esc(nm(a))} reads and answers the question.</div>${quote}${question}${ret}`);
    const h=sn.history.find(x=>x.i===idx);
    return wrap('guess',`${tag}${quote}${question}${h?revealHtml(h.ans):''}${ret}`);
  }
  if(c.type==='TALK')return wrap('talk',`<div class="who">${esc(nm(a))} reads and answers the question.</div>${quote}${question}<div class="card-bottom">${back}${nextOrWait}</div>`);
  if(sn.phase==='reveal'&&sn.answers)
    return wrap('guess',`${quote}${question}${revealHtml(sn.answers)}<div class="card-bottom">${back}${nextOrWait}</div>`);
  const p=myPriv(),locked=sn.locked[me]||(p.lockIntent===idx&&p.picks[idx]!=null),sel=locked?p.picks[idx]:p.sel[idx],other=partner();
  const role=me===a?`${esc(nm(a))}, choose your answer privately.`:`${esc(nm(g))}, guess ${esc(nm(a))}'s answer.`;
  const canPick=sn.phase==='pick'&&!locked;
  const options=c.options.map((o,i)=>`<button class="choice ${sel===i?'selected':''}" ${canPick?'':'disabled'} onclick="choose(${i})"><b>${'ABCD'[i]}</b>${esc(o)}</button>`).join('');
  let footer;
  if(sn.phase==='collect')footer=`<span class="wait-note">Revealing…</span>`;
  else if(locked)footer=`<span class="wait-note">✓ Locked in · waiting for ${esc(nm(other))}… <button class="link-btn" onclick="changeMine()">Change</button></span>`;
  else footer=`<button class="phase-button" ${sel==null?'disabled':''} onclick="lockMine()">${me===a?'Lock answer →':'Lock guess →'}</button>`;
  return wrap('guess',`<div class="who">${role}</div>${quote}${question}<div class="options">${options}</div><div class="card-bottom">${back}${footer}</div>`);
}
function drawFinal(){
  const p=myPriv();
  if(p.activity===null&&!N.snap.actSent[N.me])return drawActivity(true);
  return render(`<div class="winner"><div style="letter-spacing:.15em;font-weight:800">TIME FOR TWO®</div><h1>All cards played!</h1><p>Revealing the winner…</p>${netBanner()}</div>`);
}
function drawResult(){
  const sn=N.snap,names=[nm(0),nm(1)],acts=sn.activities||[5,5];
  let tie=sn.scores[0]===sn.scores[1],win=sn.scores[0]>sn.scores[1]?0:1,act=acts[win];
  return render(`<div class="winner"><div style="letter-spacing:.15em;font-weight:800">TIME FOR TWO®</div><h1>${tie?"It's a Tie!":esc(names[win])+" Wins!"}</h1><p>${tie?'Two Winners. Twice the Fun!':'The best part? You both get to enjoy the prize.'}</p><div class="prize">${tie?`<h2>Choose one activity—or enjoy both!</h2><p><strong>${esc(names[0])}:</strong> ${esc(ACT[acts[0]][0])}<br>${esc(ACT[acts[0]][1])}</p><p><strong>${esc(names[1])}:</strong> ${esc(ACT[acts[1]][0])}<br>${esc(ACT[acts[1]][1])}</p>`:`<div class="eyebrow" style="color:#ffd5cb">Your future activity</div><h2>${esc(ACT[act][0])}</h2><p>${esc(ACT[act][1])}</p><p>${esc(names[1-win])} gets to arrange it!</p>`}</div><p>Final score: ${esc(names[0])} ${sn.scores[0]} · ${esc(names[1])} ${sn.scores[1]}</p><div class="actions">${btn('Play again','playAgain()','coral')}${btn('Leave game','leaveGame()','quiet-back t2-leave')}</div></div>`);
}

/* ================= START-UP ================= */
(function boot(){
  const tab=SS.get(TAB_KEY),hs=fresh(LS.get(HOST_KEY)),gs=fresh(LS.get(GUEST_KEY));
  if(tab&&tab.role==='host'&&hs&&hs.code===tab.code&&(!joinCode||joinCode===tab.code)){screen=tab.screen||'invite';inviteMode='host';return startHost(hs)}
  if(tab&&tab.role==='guest'&&gs&&gs.code===tab.code&&(!joinCode||joinCode===tab.code)){screen=tab.screen||'directions';return startJoin(gs.code,gs.name,gs.token,true)}
  if(joinCode&&gs&&gs.code===joinCode){screen='directions';return startJoin(gs.code,gs.name,gs.token,true)}
  if(joinCode){inviteMode='join';screen='invite';stack=['home','description'];stackY=[0,0]}
  draw();
})();

</script></body></html>
